name: Build cross-device audio fallbacks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-audio-fallbacks.yml"
      - "sounds/*.ogg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cross-device-audio
  cancel-in-progress: false

jobs:
  convert-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert bundled Ogg audio to MP3
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sounds/*.ogg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Ogg audio files found."
            exit 1
          fi
          for source in "${files[@]}"; do
            target="${source%.ogg}.mp3"
            echo "Converting ${source} to ${target}"
            ffmpeg -nostdin -hide_banner -loglevel error -y -i "${source}" -vn -codec:a libmp3lame -q:a 4 "${target}"
          done
          test -f sounds/title-theme.mp3
          test -f sounds/menu-theme.mp3
          test -f sounds/battle-theme.mp3

      - name: Commit MP3 fallbacks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sounds/*.mp3
          if git diff --cached --quiet; then
            echo "MP3 fallbacks are already up to date."
            exit 0
          fi
          git commit -m "Add MP3 fallbacks for cross-device audio"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main-branch update; retrying."
          done
          echo "Failed to push MP3 fallbacks after three attempts."
          exit 1
