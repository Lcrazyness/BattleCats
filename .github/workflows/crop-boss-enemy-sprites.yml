name: Crop Gory and Sir Seal sprite sheets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crop-boss-enemy-sprites.yml"
      - "scripts/crop_boss_enemy_sprites.py"

permissions:
  contents: write

jobs:
  crop-sprites:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BattleCats
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install image tools
        run: python -m pip install --upgrade Pillow
      - name: Crop and normalize sprite PNGs
        run: python scripts/crop_boss_enemy_sprites.py
      - name: Commit standalone sprite PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A enemys/Gory enemys/Sir-Seal enemys/gory enemys/sir-seal Cats/Gross-Cat Cats/axe-cat
          if git diff --cached --quiet; then
            echo "No cropped or normalized sprite changes."
            exit 0
          fi
          git commit -m "Match Doge enemy folders and normalize sprite frames"
          git push
