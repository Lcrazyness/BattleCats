name: Crop seven new Empire of Cats enemies

on:
  push:
    branches: [main]
    paths:
      - "scripts/crop_new_empire_enemies.py"
      - ".github/workflows/crop-new-empire-enemies.yml"
      - "enemys/B.B.Bunny/Screenshot 2026-11-05 141657.png"
      - "enemys/Kang Roo/Screenshot 2026-11-05 142240.png"
      - "enemys/Squire Rel/Screenshot 2026-11-05 142420.png"
      - "enemys/Mooth/Screenshot 2026-11-05 142612.png"
      - "enemys/One Horn/Screenshot 2026-11-05 143648.png"
      - "enemys/Teacher Bear/Screenshot 2026-11-05 143853.png"
      - "enemys/The Face/Screenshot 2026-11-05 144239.png"

permissions:
  contents: write

concurrency:
  group: crop-new-empire-enemies
  cancel-in-progress: false

jobs:
  crop-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install pillow
      - name: Crop enemy animation frames
        run: python scripts/crop_new_empire_enemies.py
      - name: Commit transparent PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "enemys/B.B.Bunny" "enemys/Kang Roo" "enemys/Squire Rel" "enemys/Mooth" "enemys/One Horn" "enemys/Teacher Bear" "enemys/The Face"
          if git diff --cached --quiet; then
            echo "No sprite changes."
            exit 0
          fi
          git commit -m "Crop seven new Empire of Cats enemies"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; rebasing and retrying."
          done
          echo "Could not push generated assets after three attempts."
          exit 1
