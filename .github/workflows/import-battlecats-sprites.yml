name: Import Battle Cats Menu Assets

on:
  push:
    branches: [main]
    paths:
      - "scripts/import_battlecats_sprites.py"
      - ".github/workflows/import-battlecats-sprites.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-battlecats-menu-assets
  cancel-in-progress: false

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependency
        run: python -m pip install requests pillow opencv-python-headless

      - name: Download Battle Cats menu art and relevant sprite sheets
        run: python scripts/import_battlecats_sprites.py

      - name: Commit and push downloaded assets safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new sprite assets to commit."
            exit 0
          fi
          git commit -m "Bundle Battle Cats menu art and sprite sheets"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main-branch update; rebasing and retrying."
          done
          echo "Could not push sprite updates after three attempts."
          exit 1
