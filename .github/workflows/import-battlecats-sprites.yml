name: Import Battle Cats Menu Assets

on:
  push:
    branches: [main]
    paths:
      - "scripts/import_battlecats_sprites.py"
      - ".github/workflows/import-battlecats-sprites.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-battlecats-menu-assets
  cancel-in-progress: false

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependency
        run: python -m pip install requests

      - name: Download Battle Cats menu art and relevant sprite sheets
        run: python scripts/import_battlecats_sprites.py

      - name: Commit downloaded assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sprites/
          if git diff --cached --quiet; then
            echo "No new sprite assets to commit."
          else
            git commit -m "Bundle Battle Cats menu art and sprite sheets"
            git push
          fi
