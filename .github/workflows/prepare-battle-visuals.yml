name: Prepare Battle Cats Visual Assets

on:
  push:
    branches: [main]
    paths:
      - "scripts/prepare_battle_visuals.py"
      - ".github/workflows/prepare-battle-visuals.yml"
      - "sprites/original_sheets/doge-animation-atlas.png"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-battlecats-visual-assets
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing dependency
        run: python -m pip install pillow
      - name: Verify JavaScript syntax
        run: node --check src/main.js
      - name: Crop Doge and remove Cat Base frame
        run: python scripts/prepare_battle_visuals.py
      - name: Commit prepared assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enemys/doge/moving enemys/doge/attack enemys/doge/damaged enemys/doge/idle.png sprites/backgrounds/bg_restored.png
          if git diff --cached --quiet; then
            echo "Visual assets are already up to date."
            exit 0
          fi
          git commit -m "Improve Doge crops and clean Cat Base background"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main-branch update; rebasing and retrying."
          done
          echo "Could not push prepared visual assets after three attempts."
          exit 1
