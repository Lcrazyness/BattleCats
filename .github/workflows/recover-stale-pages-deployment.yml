name: Recover Stuck GitHub Pages Deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-stale-pages-deployment.yml"

permissions:
  pages: write
  contents: read

jobs:
  cancel-stale-pages-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the stuck deployment blocking the latest publish
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_PAGES_DEPLOYMENT: "216ff1839c71725b3c423fe5e2b9f256df159b9c"
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_PAGES_DEPLOYMENT}/cancel" \
            --silent
          echo "Cancelled the stale Pages deployment ${STALE_PAGES_DEPLOYMENT}."
