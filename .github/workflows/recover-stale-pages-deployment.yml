name: Recover Stuck GitHub Pages Deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-stale-pages-deployment.yml"

permissions:
  pages: write
  contents: read

jobs:
  cancel-stale-pages-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel older Pages deployments that block this publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_ids="$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments?per_page=100" --jq '.[] | select(.status == "in_progress") | select(.sha != env.GITHUB_SHA) | .id')"
          if [[ -z "${deployment_ids}" ]]; then
            echo "No stale in-progress Pages deployments found."
            exit 0
          fi
          while IFS= read -r deployment_id; do
            [[ -z "${deployment_id}" ]] && continue
            echo "Cancelling stale Pages deployment ${deployment_id}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment_id}/cancel" --silent
          done <<< "${deployment_ids}"
